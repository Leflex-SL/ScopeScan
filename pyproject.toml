[project]
name = "scopescan"
version = "0.2.0"
description = "Escaner de vulnerabilidades tipo Nessus: nmap + NSE vuln + panel web"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "setuptools>=68",
    "uv>=0.12.22", "pip-audit>=2.10.1", "build>=1.3.0",
]

[project.scripts]
scopescan = "scopescan.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scopescan = ["web/templates/*.html", "web/static/*", "engine_templates/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
