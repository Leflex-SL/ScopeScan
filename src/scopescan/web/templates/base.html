<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="{{ request.state.csrf_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ScopeScan{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
</head>
<body>
  <header class="top">
    <div class="brand">SCOPE<span>SCAN</span></div>
    <nav>
      <a href="/" class="{{ 'active' if active_nav == 'dashboard' }}">Escaneos</a>
      <a href="/findings" class="{{ 'active' if active_nav == 'findings' }}">Hallazgos</a>
    </nav>
    <div class="spacer"></div>
    <a class="btn primary" href="/scans/new">Nuevo escaneo</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
  const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
  const panelFetch = window.fetch.bind(window);
  window.fetch = (url, options = {}) => {
    if (new URL(url, window.location.href).origin === window.location.origin &&
        ['POST','PUT','PATCH','DELETE'].includes((options.method || 'GET').toUpperCase())) {
      options.headers = new Headers(options.headers || {});
      options.headers.set('X-CSRF-Token', csrfToken);
    }
    return panelFetch(url, options);
  };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
